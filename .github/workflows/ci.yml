name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y antiword
      - run: pip install -r requirements-dev.txt
      - run: python -m resume_screening.train
      - run: pytest -q
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t resumeiq .
      - run: |
          docker run -d -p 10000:10000 --name app resumeiq
          for i in $(seq 1 30); do curl -sf localhost:10000/health && exit 0; sleep 2; done
          docker logs app; exit 1
