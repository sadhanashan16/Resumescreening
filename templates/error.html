{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block content %}
<div class="error-page">
  <h1>{{ code }}</h1>
  <p class="muted">{{ message }}</p>
  {% if current_user.is_authenticated %}
  <a class="btn btn-primary" href="{{ url_for('main.dashboard') }}">Back to your dashboard</a>
  {% else %}
  <a class="btn btn-primary" href="{{ url_for('main.index') }}">Back to home</a>
  <a class="btn" href="{{ url_for('auth.login') }}">Log in</a>
  {% endif %}
</div>
{% endblock %}
